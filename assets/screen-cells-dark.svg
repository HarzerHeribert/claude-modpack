<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" role="img">
<title>A running cell card</title>
<desc>A rounded card: the three lines of code the cell runs, the read and edit rows done and the sh row still running with its elapsed time, and the closing line: running, a scanner, 3 calls, 1.0 s.</desc>
<rect x="0.5" y="0.5" width="879" height="191" rx="12" fill="#1a1a19" stroke="rgba(255,255,255,0.10)"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
<text x="51.2" y="38" fill="#D97757" textLength="777.6" lengthAdjust="spacing" xml:space="preserve">╭──────────────────────────────────────────────────────────────────────────────────────────────────────────╮</text>
<text x="51.2" y="54" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="80.0" y="54" fill="#898781" textLength="230.4" lengthAdjust="spacing" xml:space="preserve">await read('src/click/types.py')</text>
<text x="821.6" y="54" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="70" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="80.0" y="70" fill="#898781" textLength="604.8" lengthAdjust="spacing" xml:space="preserve">await edit('src/click/types.py', 'class BoolParamType', 'class Duration(ParamType)')</text>
<text x="821.6" y="70" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="86" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="80.0" y="86" fill="#898781" textLength="388.8" lengthAdjust="spacing" xml:space="preserve">return (await sh('pytest -q tests/test_types.py')).out</text>
<text x="821.6" y="86" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="102" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="65.6" y="102" fill="#4eba65" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">✓</text>
<text x="80.0" y="102" fill="#898781" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">read</text>
<text x="123.2" y="102" fill="#f0efec" textLength="129.6" lengthAdjust="spacing" xml:space="preserve">src/click/types.py</text>
<text x="778.4" y="102" fill="#898781" textLength="36.0" lengthAdjust="spacing" xml:space="preserve">0.0 s</text>
<text x="821.6" y="102" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="118" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="65.6" y="118" fill="#4eba65" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">✓</text>
<text x="80.0" y="118" fill="#898781" textLength="28.8" lengthAdjust="spacing" xml:space="preserve">edit</text>
<text x="123.2" y="118" fill="#f0efec" textLength="129.6" lengthAdjust="spacing" xml:space="preserve">src/click/types.py</text>
<text x="778.4" y="118" fill="#898781" textLength="36.0" lengthAdjust="spacing" xml:space="preserve">0.0 s</text>
<text x="821.6" y="118" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="134" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="65.6" y="134" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">◐</text>
<text x="80.0" y="134" fill="#898781" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">sh</text>
<text x="123.2" y="134" fill="#f0efec" textLength="208.8" lengthAdjust="spacing" xml:space="preserve">pytest -q tests/test_types.py</text>
<text x="778.4" y="134" fill="#898781" textLength="36.0" lengthAdjust="spacing" xml:space="preserve">0.9 s</text>
<text x="821.6" y="134" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="150" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="65.6" y="150" fill="#D97757" font-weight="700" textLength="50.4" lengthAdjust="spacing" xml:space="preserve">running</text>
<text x="123.2" y="150" fill="#c3c2b7" textLength="21.6" lengthAdjust="spacing" xml:space="preserve">···</text>
<text x="144.8" y="150" fill="#D97757" textLength="14.4" lengthAdjust="spacing" xml:space="preserve">━━</text>
<text x="159.2" y="150" fill="#c3c2b7" textLength="36.0" lengthAdjust="spacing" xml:space="preserve">·····</text>
<text x="202.4" y="150" fill="#898781" textLength="122.4" lengthAdjust="spacing" xml:space="preserve">· 3 calls · 1.0 s</text>
<text x="821.6" y="150" fill="#D97757" textLength="7.2" lengthAdjust="spacing" xml:space="preserve">│</text>
<text x="51.2" y="166" fill="#D97757" textLength="777.6" lengthAdjust="spacing" xml:space="preserve">╰──────────────────────────────────────────────────────────────────────────────────────────────────────────╯</text>
</g>
</svg>
