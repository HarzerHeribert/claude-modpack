---
- name: Create the shop user
  ansible.builtin.user:
    name: shop
    system: true
    create_home: false

- name: Fetch the app's code
  ansible.builtin.git:
    repo: https://git.shop.internal/shop/app.git
    dest: /opt/shop/src
    version: "v{{ shop_version }}"
  register: shop_code

- name: Install the app into its virtualenv
  ansible.builtin.pip:
    requirements: /opt/shop/src/app/requirements.txt
    virtualenv: /opt/shop/venv
    virtualenv_command: python3 -m venv

- name: Install the systemd unit
  ansible.builtin.template:
    src: shop-app.service.j2
    dest: /etc/systemd/system/shop-app.service
    owner: root
    group: root
    mode: "0644"

- name: Start the app
  ansible.builtin.systemd_service:
    name: shop-app
    state: started
    enabled: true
    daemon_reload: true

- name: Install the backup script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../scripts/shop-backup"
    dest: /usr/local/bin/shop-backup
    owner: root
    group: root
    mode: "0755"

- name: Back up the database every night
  ansible.builtin.cron:
    name: shop database backup
    minute: "30"
    hour: "2"
    user: root
    job: DB_NAME=shop /usr/local/bin/shop-backup
